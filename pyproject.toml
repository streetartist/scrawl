[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "scrawl-engine"
version = "2.2.0"
description = "A simple yet powerful 2D game engine built on Bevy"
authors = [{name = "Streetartist"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
]

[tool.maturin]
manifest-path = "crates/scrawl-bridge/Cargo.toml"
python-source = "python"
python-packages = ["scrawl"]
module-name = "scrawl.scrawl_native"
include = [{ path = "LICENSE", format = "sdist" }]
